name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build.cjs
      - name: committed dist/ is exactly what the source builds
        run: git diff --exit-code -- dist/
      - name: the public build is general (no center questions, names or case study)
        run: |
          ! grep -nE 'SFTPC|NKX2-1|KRT17|SKAAR|Carlos|CReM-KG|Villacorta|Lauren|Kotton' dist/LemonAId.html
      - name: a center configuration builds and carries its questions
        run: |
          node build.cjs --queries config/crem.queries.json --name LemonAId_config_check
          grep -q 'LEMONAID_QUERIES' dist/LemonAId_config_check.html && grep -q 'SFTPC and NKX2-1' dist/LemonAId_config_check.html
          rm dist/LemonAId_config_check.html
      - name: no hand-written version labels in the source
        run: |
          ! grep -nE 'planner v0\.[0-9]|prototype · v0\.[0-9]' src/*.js src/*.html
      - run: node --test tests/engine.test.cjs tests/app.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile tools/fcs_panel_manifest.py tools/lookup_public.py
      - name: public-record lookup on the fixture inventory
        run: |
          python3 tools/lookup_public.py tests/fixtures/lookup_inventory.tsv --out /tmp/lookup
          grep -q 'Accession mentioned in another field, none recorded: 2' /tmp/lookup/lookup_summary.md
      - name: standalone build has no external dependencies
        run: |
          ! grep -q '<script[^>]*src=' dist/LemonAId.html
          ! grep -q '<link[^>]*href=' dist/LemonAId.html
