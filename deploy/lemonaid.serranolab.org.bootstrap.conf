# Port 80 only, used once before the first certificate exists (DEPLOYMENT.md step 5).
# nginx refuses to start with the full config until the certificate files are present;
# this file lets certbot's webroot challenge succeed, then the full config replaces it.
server {
    listen 80;
    server_name lemonaid.serranolab.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
