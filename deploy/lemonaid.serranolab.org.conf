# nginx server block for LemonAId: one static file, HTTPS only.
# Place at /etc/nginx/sites-available/lemonaid.serranolab.org and symlink into sites-enabled.
# Certificates come from certbot in webroot mode (see DEPLOYMENT.md); certbot never edits this file,
# so the copy on the server stays identical to the one in the repository.

server {
    listen 80;
    server_name lemonaid.serranolab.org;
    server_tokens off;  # error pages and headers do not advertise the nginx version
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name lemonaid.serranolab.org;
    server_tokens off;  # error pages and headers do not advertise the nginx version

    ssl_certificate     /etc/letsencrypt/live/lemonaid.serranolab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemonaid.serranolab.org/privkey.pem;

    # Who may see the site. The file holds allow/deny lines and lives only on the server, so an
    # address never enters the repository. Until v0.8.0 it allows BU's address and denies the rest
    # (deploy/access-gated.conf.example); after Carlos's review it is replaced by deploy/access-open.conf.
    # Port 80 is not gated, so certificate renewal keeps working.
    include /etc/nginx/lemonaid-access.conf;

    root /var/www/lemonaid/current;
    index LemonAId.html;

    # The app makes no network calls. The policy below makes that a promise the browser enforces:
    # no scripts, styles, images or connections from anywhere but this file.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { return 302 /LemonAId.html; }
    location / { try_files $uri =404; }
    # nginx drops server-level add_header lines in any location that sets its own, so the
    # security headers are repeated here; without them the app file would be served without CSP.
    location = /LemonAId.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location = /VERSION { default_type text/plain; }
}
